[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storefront-audit"
version = "0.1.0"
description = "Evidence-based technical, SEO and performance audits for Shopify and other ecommerce storefronts."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jay Taraviya"}]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "lxml>=4.9", "Jinja2>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
storefront-audit = "storefront_audit.cli:main"

[tool.setuptools.packages.find]
include = ["storefront_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
